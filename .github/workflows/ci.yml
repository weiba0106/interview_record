name: ci
on:
  pull_request:
  push:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.9
        env:
          MYSQL_DATABASE: interview_record_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
          MYSQL_ROOT_PASSWORD: root-test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-test"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/interview_record_test?serverTimezone=UTC
      TEST_DB_USERNAME: test
      TEST_DB_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: ./mvnw verify
        working-directory: apps/api
      - run: npm ci
        working-directory: apps/web
      - run: npm run test:unit -- --run
        working-directory: apps/web
      - run: npm run type-check
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
