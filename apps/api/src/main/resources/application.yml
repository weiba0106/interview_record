spring:
  application:
    name: interview-record-api
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  session:
    timeout: 12h
    jdbc:
      initialize-schema: never
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

server:
  servlet:
    session:
      cookie:
        name: INTERVIEW_RECORD_SESSION
        http-only: true
        secure: true
        same-site: lax

app:
  frontend-base-url: ${APP_BASE_URL:http://localhost:5173}
